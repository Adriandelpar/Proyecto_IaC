---
- name: Instalar Apache
  ansible.builtin.apt:
    name: apache2
    state: present

- name: Crear el directorio del sitio
  ansible.builtin.file:
    path: "/var/www/{{ dominio }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Crear la página estática de esta web
  ansible.builtin.template:
    src: index.html.j2
    dest: "/var/www/{{ dominio }}/index.html"
    owner: root
    group: root
    mode: "0644"

- name: Crear el virtual host
  ansible.builtin.template:
    src: vhost.conf.j2
    dest: "/etc/apache2/sites-available/{{ dominio }}.conf"
    mode: "0644"
  notify: Recargar Apache

- name: Activar el virtual host
  ansible.builtin.file:
    src: "/etc/apache2/sites-available/{{ dominio }}.conf"
    dest: "/etc/apache2/sites-enabled/{{ dominio }}.conf"
    state: link
  notify: Recargar Apache

- name: Desactivar el sitio por defecto
  ansible.builtin.file:
    path: /etc/apache2/sites-enabled/000-default.conf
    state: absent
  notify: Recargar Apache

- name: Arrancar y habilitar Apache
  ansible.builtin.service:
    name: apache2
    state: started
    enabled: true
