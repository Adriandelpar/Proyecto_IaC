---
- name: Instalar el servidor NFS
  ansible.builtin.apt:
    name: nfs-kernel-server
    state: present

- name: Crear el sistema de ficheros en el disco de datos
  community.general.filesystem:
    fstype: ext4
    dev: "{{ disco_datos }}"

- name: Montar el disco de datos de forma persistente
  ansible.posix.mount:
    path: "{{ nfs_dir }}"
    src: "{{ disco_datos }}"
    fstype: ext4
    state: mounted

- name: Permisos del directorio compartido
  ansible.builtin.file:
    path: "{{ nfs_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Descargar la aplicación guestbook en el disco compartido
  ansible.builtin.git:
    repo: "{{ repo }}"
    dest: "{{ nfs_dir }}/guestbook"
    version: main
    update: false

- name: Generar config.php de la aplicación
  ansible.builtin.template:
    src: config.php.j2
    dest: "{{ nfs_dir }}/guestbook/config.php"
    owner: root
    group: www-data
    mode: "0640"

- name: Configurar las exportaciones NFS
  ansible.builtin.template:
    src: exports.j2
    dest: /etc/exports
    mode: "0644"
  notify: Recargar exportaciones

- name: Arrancar y habilitar el servidor NFS
  ansible.builtin.service:
    name: nfs-server
    state: started
    enabled: true
