---
- name: Instalar HAProxy
  ansible.builtin.apt:
    name: haproxy
    state: present

- name: Configurar HAProxy con las webs del inventario
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    mode: "0644"
    validate: haproxy -c -f %s
  notify: Reiniciar HAProxy

- name: Arrancar y habilitar HAProxy
  ansible.builtin.service:
    name: haproxy
    state: started
    enabled: true
